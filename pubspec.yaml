name: vanilink
description: "Offline P2P Walkie-Talkie with on-device Indic STT and TTS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # On-device Speech-to-Text & Text-to-Speech via ONNX
  sherpa_onnx: ^1.10.42

  # Microphone audio recording and playback
  record: 7.1.1
  audioplayers: ^6.0.0

  # Wi-Fi Direct (P2P) networking
  flutter_p2p_connection: ^2.0.2

  # Permission handling at runtime
  permission_handler: ^11.3.1
  archive: ^4.2.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Register bundled on-device quantized model assets
  assets:
  - assets/models/stt/indic/
  - assets/models/tts/en/
  