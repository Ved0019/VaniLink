name: vanilink
description: "Offline P2P Walkie-Talkie with on-device Indic STT and TTS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # On-device Speech-to-Text & Text-to-Speech via ONNX
  sherpa_onnx: ^1.10.42

  # Microphone audio recording and playback
  record: 7.1.1
  audioplayers: ^6.0.0

  # Wi-Fi Direct (P2P) networking
  flutter_p2p_connection: ^2.0.2

  # Permission handling at runtime
  permission_handler: ^11.3.1
  archive: ^4.2.0
  path_provider: ^2.1.0
  google_fonts: ^8.2.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    # STT models
    - assets/models/stt/indic/
    - assets/models/stt/english/

    # TTS models — one folder per language (lazy-loaded at runtime)
    - assets/models/tts/en/
    - assets/models/tts/hi/
    - assets/models/tts/gu/
    - assets/models/tts/mr/
    - assets/models/tts/kn/
    - assets/models/tts/ml/
    - assets/models/tts/ta/
    - assets/models/tts/te/
    - assets/models/tts/or/
    - assets/models/tts/bn/

    # eSpeak-ng data for each language (required for TTS)
    - assets/models/tts/en/espeak-ng-data.zip
    - assets/models/tts/hi/espeak-ng-data.zip
    - assets/models/tts/gu/espeak-ng-data.zip
    - assets/models/tts/mr/espeak-ng-data.zip
    - assets/models/tts/kn/espeak-ng-data.zip
    - assets/models/tts/ml/espeak-ng-data.zip
    - assets/models/tts/ta/espeak-ng-data.zip
    - assets/models/tts/te/espeak-ng-data.zip
    - assets/models/tts/or/espeak-ng-data.zip
    - assets/models/tts/bn/espeak-ng-data.zip